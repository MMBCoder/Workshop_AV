# Publish the slide deck (web/) to GitHub Pages on every push to main.
# The deck is plain HTML + a vendored reveal.js, so there's nothing to build —
# we just upload web/ as the site root.
name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:        # lets you re-deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a queued one supersedes the last.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
